<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Coach</title>
  <style>
    body{font-family:system-ui,Arial;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;background:#0f172a;color:#fff}
    .card{width:420px;max-width:92vw;background:#1e293b;border-radius:24px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
    .btn{width:100%;padding:16px 18px;border:0;border-radius:14px;background:#0ea5e9;color:#fff;font-size:18px;cursor:pointer}
    .btn.active{background:#ef4444}
    .muted{color:#93a4b8;font-size:13px;margin-top:10px;line-height:1.4}
    pre{margin:12px 0 0;text-align:left;font-size:12px;white-space:pre-wrap;color:#cbd5e1;background:#0b1220;border-radius:14px;padding:12px;border:1px solid rgba(148,163,184,.2)}
  </style>
</head>
<body>
  <div class="card">
    <h1 style="margin:6px 0 0">AI Coach</h1>
    <button id="btn" class="btn">Start Session</button>
    <div class="muted" id="status">Ready</div>
    <pre id="debug" style="display:none"></pre>
  </div>

  <script type="module">
    import Vapi from "https://cdn.jsdelivr.net/npm/@vapi-ai/web/+esm";

    const PUBLIC_KEY = "8904cfd2-8271-40eb-93cf-93778350e587";
    const ASSISTANT_ID = "027e16e8-3853-4f51-86ef-df10a11d3aec";

    const btn = document.getElementById("btn");
    const statusEl = document.getElementById("status");
    const debugEl = document.getElementById("debug");

    const vapi = new (Vapi.default || Vapi)(PUBLIC_KEY);
    let started = false;

    function setStatus(t){ statusEl.textContent = t; }
    function showDebug(obj){ debugEl.style.display="block"; debugEl.textContent = JSON.stringify(obj,null,2); }

    btn.addEventListener("click", async () => {
      try {
        if (!started) {
          setStatus("Requesting microphone...");
          await navigator.mediaDevices.getUserMedia({ audio: true });

          setStatus("Starting Vapi...");
          await vapi.start(ASSISTANT_ID);
        } else {
          vapi.stop();
        }
      } catch (e) {
        setStatus("Error");
        showDebug({ name: e?.name, message: e?.message, origin: location.origin, secureContext: window.isSecureContext });
        console.error(e);
      }
    });

    vapi.on("call-start", () => {
      started = true;
      btn.textContent = "Stop Session";
      btn.classList.add("active");
      setStatus("Connected. Speak now.");
    });

    vapi.on("call-end", () => {
      started = false;
      btn.textContent = "Start Session";
      btn.classList.remove("active");
      setStatus("Session ended");
    });

    vapi.on("error", (e) => {
      setStatus("Vapi error");
      showDebug(e);
      console.error("Vapi error", e);
    });
  </script>
</body>
</html>
