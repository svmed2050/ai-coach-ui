<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Coach</title>
  <style>
    body{font-family:system-ui,Arial;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;background:#0f172a;color:#fff}
    .card{width:440px;max-width:92vw;background:#1e293b;border-radius:24px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
    .btn{width:100%;padding:16px 18px;border:0;border-radius:14px;background:#0ea5e9;color:#fff;font-size:18px;cursor:pointer}
    .btn.active{background:#ef4444}
    .muted{color:#93a4b8;font-size:13px;margin-top:10px;line-height:1.4}
    .pill{display:inline-flex;gap:8px;align-items:center;background:#0b1220;border:1px solid rgba(148,163,184,.25);padding:6px 10px;border-radius:999px;font-size:13px;color:#cbd5e1;margin:10px 0 12px}
    pre{margin:12px 0 0;text-align:left;font-size:12px;white-space:pre-wrap;color:#cbd5e1;background:#0b1220;border-radius:14px;padding:12px;border:1px solid rgba(148,163,184,.2);display:none}
    .focus{margin-top:6px}
  </style>
</head>
<body>
  <div class="card">
    <h1 style="margin:6px 0 0">AI Coach</h1>
    <div class="pill" id="memPill">Loading memory...</div>
    <div class="muted focus" id="focus"></div>

    <button id="btn" class="btn">Start Session</button>
    <div class="muted" id="status">Ready</div>
    <pre id="debug"></pre>
  </div>

  <script type="module">
    import Vapi from "https://cdn.jsdelivr.net/npm/@vapi-ai/web/+esm";

    const PUBLIC_KEY = "8904cfd2-8271-40eb-93cf-93778350e587";
    const ASSISTANT_ID = "027e16e8-3853-4f51-86ef-df10a11d3aec";

    // Твой memory endpoint (он сейчас на /webhook/coach и отдает JSON ok/profile)
    const MEMORY_URL = "https://growthautomation-leadgen.app.n8n.cloud/webhook/coach";

    const btn = document.getElementById("btn");
    const statusEl = document.getElementById("status");
    const debugEl = document.getElementById("debug");
    const memPill = document.getElementById("memPill");
    const focusEl = document.getElementById("focus");

    const vapi = new (Vapi.default || Vapi)(PUBLIC_KEY);

    let started = false;
    let profile = null;
    let injected = false;

    function setStatus(t){ statusEl.textContent = t; }
    function showDebug(obj){
      debugEl.style.display = "block";
      debugEl.textContent = JSON.stringify(obj, null, 2);
    }

    function buildSystemPrompt(p){
      return [
        "You are a world-class life coach and accountability partner.",
        "Speak English only.",
        "Be gentle but firm. Keep answers concise and actionable.",
        "Use structure: reflect, clarify, next step, accountability check.",
        "",
        "User coaching profile (memory):",
        "Base identity: " + (p.base_identity || "N/A"),
        "Current focus: " + (p.current_focus || "N/A"),
        "Psychological state: " + (p.psychological_state || "N/A"),
        "Last session summary: " + (p.last_session_summary || "N/A"),
        "Action items: " + (p.action_items || "N/A"),
        "Updated at: " + (p.updated_at || "N/A"),
        "",
        "Goal for this call: complete a short coaching session and agree on 1-3 concrete actions for the next 24 hours."
      ].join("\\n");
    }

    async function loadMemory(){
      const r = await fetch(MEMORY_URL, { method: "GET" });
      if (!r.ok) throw new Error("Memory fetch failed: " + r.status);
      const data = await r.json();
      if (!data?.ok) throw new Error("Memory endpoint returned ok=false");
      return data.profile;
    }

    // Загружаем memory сразу при открытии страницы
    (async () => {
      try {
        setStatus("Loading memory...");
        profile = await loadMemory();
        memPill.textContent = "Memory loaded";
        focusEl.textContent = profile?.current_focus ? ("Focus: " + profile.current_focus) : "";
        setStatus("Ready");
      } catch (e) {
        memPill.textContent = "Memory failed";
        setStatus("Fix memory endpoint / CORS");
        showDebug({ error: String(e) });
      }
    })();

    btn.addEventListener("click", async () => {
      try {
        debugEl.style.display = "none";
        debugEl.textContent = "";

        if (!profile) throw new Error("No memory loaded yet");

        if (!started) {
          setStatus("Requesting microphone...");
          await navigator.mediaDevices.getUserMedia({ audio: true });

          setStatus("Starting call...");
          injected = false;
          await vapi.start(ASSISTANT_ID);
        } else {
          vapi.stop();
        }
      } catch (e) {
        setStatus("Error");
        showDebug({
          name: e?.name,
          message: e?.message,
          origin: location.origin,
          secureContext: window.isSecureContext
        });
        console.error(e);
      }
    });

    vapi.on("call-start", async () => {
      started = true;
      btn.textContent = "Stop Session";
      btn.classList.add("active");
      setStatus("Connected. Injecting memory...");

      try {
        // 1) Вставляем system message с памятью
        vapi.send({
          type: "add-message",
          message: { role: "system", content: buildSystemPrompt(profile) }
        });

        // 2) Стартуем разговор сами, чтобы ассистент точно учитывал system message
        // (Если ассистент у тебя в Vapi говорит первым, этот шаг критичен)
        await vapi.say(
          "Hi! I loaded your coaching profile. Let's start. In one sentence, what is the main outcome you want from today?"
        );

        injected = true;
        setStatus("Ready. Speak now.");
      } catch (e) {
        setStatus("Connected, but injection failed");
        showDebug(e);
      }
    });

    vapi.on("call-end", () => {
      started = false;
      injected = false;
      btn.textContent = "Start Session";
      btn.classList.remove("active");
      setStatus("Session ended");
    });

    vapi.on("error", (e) => {
      setStatus("Vapi error");
      showDebug(e);
      console.error("Vapi error", e);
    });
  </script>
</body>
</html>
